{% extends "base.html" %}

{% block title %}Reset Password - InternLens AI{% endblock %}

{% block content %}
<div class="row min-vh-100 align-items-center justify-content-center py-5">
    <div class="col-12 col-md-8 col-lg-5 col-xl-4">
        <div class="text-center mb-4">
            <h2 class="text-white fw-black uppercase tracking-widest display-6 m-0 text-brand-primary" style="letter-spacing: 0.1em; font-family: var(--font-display);">INTERNLENS AI</h2>
            <p class="text-xs text-zinc-500 uppercase tracking-widest mt-1">Internship Performance Intelligence Platform</p>
        </div>
        
        <div class="glass-card">
            <div class="mb-4">
                <h4 class="text-white m-0 uppercase tracking-wider text-sm fw-black">Reset Credentials</h4>
                <p class="text-[11px] text-zinc-500 m-0 uppercase font-mono">Simulate a credentials dispatch</p>
            </div>
            
            <form method="POST" action="{{ url_for('forgot_password') }}">
                <div class="mb-4">
                    <label class="form-label text-[10px] uppercase font-black text-zinc-400 tracking-wider">Registered Email</label>
                    <input type="email" name="email" class="form-control text-xs" placeholder="e.g. liam@internlens.com" required>
                </div>
                
                <button type="submit" class="btn btn-brand w-100 py-3 mb-3">Request Code Dispatch</button>
            </form>
            
            <div class="text-center pt-2 border-top border-zinc-800 mt-3">
                <a href="{{ url_for('login') }}" class="text-[10px] text-zinc-500 font-black uppercase tracking-wider text-decoration-none hover:text-white"><i data-lucide="arrow-left" class="d-inline-block align-middle me-1" style="width: 12px;"></i> Return to Access Node</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
