{% extends "base.html" %}

{% block title %}Register - InternLens AI{% endblock %}

{% block content %}
<div class="row min-vh-100 align-items-center justify-content-center py-5">
    <div class="col-12 col-md-8 col-lg-5 col-xl-4">
        <div class="text-center mb-4">
            <h2 class="text-white fw-black uppercase tracking-widest display-6 m-0 text-brand-primary" style="letter-spacing: 0.1em; font-family: var(--font-display);">INTERNLENS AI</h2>
            <p class="text-xs text-zinc-500 uppercase tracking-widest mt-1">Internship Performance Intelligence Platform</p>
        </div>
        
        <div class="glass-card">
            <div class="mb-4">
                <h4 class="text-white m-0 uppercase tracking-wider text-sm fw-black">Register Terminal</h4>
                <p class="text-[11px] text-zinc-500 m-0 uppercase font-mono">Create your platform credentials</p>
            </div>
            
            <form method="POST" action="{{ url_for('register') }}">
                <div class="mb-3">
                    <label class="form-label text-[10px] uppercase font-black text-zinc-400 tracking-wider">Requested Role</label>
                    <select name="role" class="form-select text-xs uppercase font-bold tracking-wider">
                        <option value="student">Student Portal</option>
                        <option value="faculty">Faculty Command</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label text-[10px] uppercase font-black text-zinc-400 tracking-wider">Username</label>
                    <input type="text" name="username" class="form-control text-xs" placeholder="e.g. liamchen" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label text-[10px] uppercase font-black text-zinc-400 tracking-wider">Email Address</label>
                    <input type="email" name="email" class="form-control text-xs" placeholder="e.g. liam@internlens.com" required>
                </div>
                
                <div class="mb-4">
                    <label class="form-label text-[10px] uppercase font-black text-zinc-400 tracking-wider">Create Access Password</label>
                    <input type="password" name="password" class="form-control text-xs" placeholder="Minimum 6 characters" required>
                </div>
                
                <button type="submit" class="btn btn-brand w-100 py-3 mb-3">Provision Account</button>
            </form>
            
            <div class="text-center pt-2 border-top border-zinc-800 mt-3">
                <span class="text-[10px] text-zinc-500 uppercase font-black tracking-wider">Already have credentials?</span>
                <a href="{{ url_for('login') }}" class="text-[10px] text-brand-primary font-black uppercase tracking-wider text-decoration-none hover:underline ms-1">Log In</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
